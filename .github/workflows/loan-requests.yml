name: Loan requests

# Handles loan request issues: validates new requests, notifies approvers, and applies the
# /approve, /reject, /issue and /return commands approvers post as comments.
on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: loan-request-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  handle:
    # Skip pull requests, and comments that aren't commands.
    if: >-
      !github.event.issue.pull_request &&
      (github.event_name == 'issues' || startsWith(github.event.comment.body, '/'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/scripts
            catalogue
            js
      - uses: actions/github-script@v7
        with:
          script: |
            const bot = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/loan-bot.js`);
            await bot({ github, context, core });
